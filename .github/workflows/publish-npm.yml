name: Publish to npm

# TAG-triggered (matches the serpex SDK repos). Push a `v<version>` tag to publish.
# NO auto-bump: set package.json's version yourself, commit, then tag + push the tag.
# A normal push to main does NOT publish anymore.
# npm Trusted Publishing (OIDC): no NPM_TOKEN, nothing to expire.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      # npm (not pnpm) publishes: npm's CLI does the OIDC exchange
      - run: npm publish --access public
